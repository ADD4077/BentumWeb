<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BNTU Bot - Умное расписание</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
        }
    </script>
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
    <script>
        // Проверка загрузки всех зависимостей
        window.addEventListener('load', function() {
            if (typeof React === 'undefined') {
                console.error('React не загружен');
                document.getElementById('root').innerHTML = '<div style="padding: 20px; color: red;">Ошибка: React не загружен</div>';
                return;
            }
            if (typeof ReactDOM === 'undefined') {
                console.error('ReactDOM не загружен');
                document.getElementById('root').innerHTML = '<div style="padding: 20px; color: red;">Ошибка: ReactDOM не загружен</div>';
                return;
            }
            if (typeof lucide === 'undefined') {
                console.error('Lucide не загружен');
                document.getElementById('root').innerHTML = '<div style="padding: 20px; color: red;">Ошибка: Lucide иконки не загружены</div>';
                return;
            }
            console.log('Все зависимости загружены успешно');
        });
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel" data-presets="env,react" data-plugins="transform-modules-umd">
        console.log('Начало выполнения React кода');
        
        const { useState, useEffect } = React;
        console.log('React хуки импортированы');

        // Иконки через Lucide UMD
        try {
            var { 
              Sun, 
              Moon, 
              LogIn, 
              Menu, 
              X, 
              Calendar, 
              Clock, 
              MapPin, 
              Bot, 
              ArrowRight,
              GraduationCap,
              ChevronRight,
              Zap,
              Shield,
              Smartphone,
              Star,
              User
            } = lucide;
            console.log('Lucide иконки импортированы');
        } catch (error) {
            console.error('Ошибка импорта Lucide:', error);
            // Создаем заглушки для иконок
            var Sun = Moon = LogIn = Menu = X = Calendar = Clock = MapPin = Bot = ArrowRight = GraduationCap = ChevronRight = Zap = Shield = Smartphone = Star = User = function(props) {
                return React.createElement('div', { 
                    style: { width: props.size || 24, height: props.size || 24, backgroundColor: '#ccc' },
                    title: 'Icon placeholder'
                });
            };
        }

        // --- Mock Data ---
        const scheduleData = {
          upper: { // 1 Неделя
            'Пн': [
              { id: 1, time: '08:00 - 09:35', subject: 'Высшая математика', type: 'Лекция', room: '324', building: '11к', teacher: 'Иванов И.И.' },
              { id: 2, time: '09:55 - 11:30', subject: 'Физика', type: 'Лабораторная', room: '210', building: '8к', teacher: 'Петров П.П.' },
              { id: 3, time: '11:40 - 13:15', subject: 'Инженерная графика', type: 'Практика', room: '505', building: '11к', teacher: 'Сидоров С.С.' },
            ],
            'Вт': [
              { id: 4, time: '13:25 - 15:00', subject: 'История Беларуси', type: 'Лекция', room: '201', building: '11к', teacher: 'Козлова А.А.' },
              { id: 5, time: '15:20 - 16:55', subject: 'Физкультура', type: 'Практика', room: 'Стадион', building: 'Спорт', teacher: 'Тренер Т.Т.' },
            ],
            'Ср': [],
            'Чт': [
              { id: 6, time: '08:00 - 09:35', subject: 'Материаловедение', type: 'Лекция', room: '412', building: '6к', teacher: 'Мельникова Е.В.' },
            ],
            'Пт': [
              { id: 7, time: '09:55 - 11:30', subject: 'Электротехника', type: 'Лабораторная', room: '112', building: '2к', teacher: 'Волков Д.С.' },
            ],
            'Сб': []
          },
          lower: { // 2 Неделя
            'Пн': [
              { id: 1, time: '09:55 - 11:30', subject: 'Философия', type: 'Семинар', room: '301', building: '11к', teacher: 'Смирнова О.Г.' },
            ],
            'Вт': [
              { id: 2, time: '08:00 - 09:35', subject: 'Высшая математика', type: 'Практика', room: '320', building: '11к', teacher: 'Иванов И.И.' },
              { id: 3, time: '09:55 - 11:30', subject: 'Теоретическая механика', type: 'Лекция', room: '405', building: '8к', teacher: 'Громов А.В.' },
            ],
            'Ср': [
              { id: 4, time: '11:40 - 13:15', subject: 'Иностранный язык', type: 'Практика', room: '601', building: '18к', teacher: 'Bond J.' },
            ],
            'Чт': [],
            'Пт': [
              { id: 5, time: '13:25 - 15:00', subject: 'Программирование', type: 'Лекция', room: '202', building: '11к', teacher: 'Прогер А.А.' },
              { id: 6, time: '15:20 - 16:55', subject: 'Программирование', type: 'Лабораторная', room: '205', building: '11к', teacher: 'Прогер А.А.' },
            ],
            'Сб': []
          }
        };

        const daysOfWeek = ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб'];

        function App() {
          const [darkMode, setDarkMode] = useState(true);
          const [activeTab, setActiveTab] = useState('home'); 
          const [weekType, setWeekType] = useState('upper');
          const [selectedDay, setSelectedDay] = useState('Пн');
          const [isLoginModalOpen, setIsLoginModalOpen] = useState(false);
          const [isMobileMenuOpen, setIsMobileMenuOpen] = useState(false);
          const [scrolled, setScrolled] = useState(false);

          useEffect(() => {
            const today = new Date().getDay();
            const days = ['Вс', 'Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб'];
            if (today !== 0) setSelectedDay(days[today]);
            else setSelectedDay('Пн');

            const handleScroll = () => setScrolled(window.scrollY > 20);
            window.addEventListener('scroll', handleScroll);
            return () => window.removeEventListener('scroll', handleScroll);
          }, []);

          // Инициализация темы при загрузке
          useEffect(() => {
            if (darkMode) {
              document.documentElement.classList.add('dark');
            } else {
              document.documentElement.classList.remove('dark');
            }
          }, [darkMode]);

          const toggleTheme = () => {
            setDarkMode(!darkMode);
            // Добавляем/убираем класс dark у html элемента
            if (!darkMode) {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
        };
          const currentSchedule = scheduleData[weekType][selectedDay] || [];

          // Простая тестовая версия с Tailwind
          return (
            <div className={`${darkMode ? 'dark' : ''} min-h-screen flex flex-col font-sans selection:bg-emerald-500 selection:text-white`}>
              <div className="flex-grow bg-gray-50 dark:bg-[#0B0F19] text-slate-900 dark:text-slate-100 transition-colors duration-500 overflow-x-hidden relative">
                
                {/* --- Header --- */}
                <header className="sticky top-0 z-50 w-full bg-white/80 dark:bg-[#0B0F19]/80 backdrop-blur-xl border-b border-gray-200/50 dark:border-slate-800/50">
                  <div className="container mx-auto px-6 h-20 flex items-center justify-between">
                    
                    {/* Logo */}
                    <div 
                      className="flex items-center gap-3 cursor-pointer group"
                      onClick={() => setActiveTab('home')}
                    >
                      <div className="relative">
                        <div className="absolute inset-0 bg-gradient-to-tr from-emerald-400 to-teal-500 rounded-xl blur opacity-75 group-hover:opacity-100 transition duration-300"></div>
                        <div className="relative bg-white dark:bg-slate-900 p-2.5 rounded-xl text-emerald-600 dark:text-emerald-400">
                          🎓
                        </div>
                      </div>
                      <div className="flex flex-col">
                        <span className="text-xl font-bold tracking-tight text-slate-900 dark:text-white leading-none">
                          BNTU <span className="text-emerald-500">Bot</span>
                        </span>
                        <span className="text-[10px] font-medium text-slate-500 dark:text-slate-400 uppercase tracking-widest mt-0.5">Assistant</span>
                      </div>
                    </div>

                    {/* Desktop Nav */}
                    <nav className="hidden md:flex items-center gap-1 p-1.5 bg-gray-100/50 dark:bg-slate-800/50 backdrop-blur-md rounded-full border border-gray-200 dark:border-slate-700/50">
                      <button 
                        onClick={() => setActiveTab('home')}
                        className={`px-6 py-2 rounded-full text-sm font-semibold transition-all duration-300 ${activeTab === 'home' ? 'bg-white dark:bg-slate-700 text-slate-900 dark:text-white shadow-sm' : 'text-slate-500 hover:text-slate-900 dark:hover:text-white'}`}
                      >
                        Главная
                      </button>
                      <button 
                        onClick={() => setActiveTab('schedule')}
                        className={`px-6 py-2 rounded-full text-sm font-semibold transition-all duration-300 ${activeTab === 'schedule' ? 'bg-white dark:bg-slate-700 text-slate-900 dark:text-white shadow-sm' : 'text-slate-500 hover:text-slate-900 dark:hover:text-white'}`}
                      >
                        Расписание
                      </button>
                    </nav>

                    {/* Actions */}
                    <div className="hidden md:flex items-center gap-4">
                      <button 
                        onClick={toggleTheme}
                        className="p-2.5 rounded-xl hover:bg-gray-100 dark:hover:bg-slate-800 transition-all text-slate-600 dark:text-slate-400 border border-transparent hover:border-gray-200 dark:hover:border-slate-700"
                      >
                        {darkMode ? '☀️' : '🌙'}
                      </button>
                      <div className="h-6 w-px bg-gray-200 dark:bg-slate-800"></div>
                      <button 
                        onClick={() => setIsLoginModalOpen(true)}
                        className="px-6 py-2.5 text-sm font-semibold text-white bg-slate-900 dark:bg-emerald-600 hover:bg-slate-800 dark:hover:bg-emerald-500 rounded-xl transition-all shadow-lg shadow-emerald-500/20"
                      >
                        Войти в аккаунт
                      </button>
                    </div>

                    {/* Mobile Menu Toggle */}
                    <button 
                      className="md:hidden p-2.5 rounded-xl bg-gray-100 dark:bg-slate-800 text-slate-900 dark:text-white"
                      onClick={() => setIsMobileMenuOpen(!isMobileMenuOpen)}
                    >
                      {isMobileMenuOpen ? '✕' : '☰'}
                    </button>
                  </div>
                </header>

                {/* --- Main Content --- */}
                <main className="container mx-auto px-4 py-12 relative z-10">
                  
                  {/* HOME TAB */}
                  {activeTab === 'home' && (
                    <div className="flex flex-col items-center">
                      <div className="text-center max-w-4xl mx-auto mb-20 mt-10">
                        <h1 className="text-5xl md:text-7xl font-bold mb-8 tracking-tight text-slate-900 dark:text-white leading-[1.1]">
                          Умное расписание <br />
                          <span className="text-transparent bg-clip-text bg-gradient-to-r from-emerald-500 via-teal-500 to-cyan-500">
                            Для студентов БНТУ
                          </span>
                        </h1>
                        
                        <p className="text-lg md:text-xl text-slate-600 dark:text-slate-400 mb-10 leading-relaxed max-w-2xl mx-auto">
                          Персональный ассистент, который знает, где ваша следующая пара. 
                          Уведомления, навигация по корпусам и синхронизация с группой — всё в одном месте.
                        </p>
                        
                        <div className="flex flex-col sm:flex-row items-center justify-center gap-4">
                          <button 
                            onClick={() => setActiveTab('schedule')}
                            className="w-full sm:w-auto px-8 py-4 bg-emerald-600 hover:bg-emerald-500 text-white rounded-2xl font-bold text-lg shadow-xl shadow-emerald-500/30 transition-all hover:-translate-y-1 flex items-center justify-center gap-2"
                          >
                            🤖 Запустить Бота
                          </button>
                          <button 
                            className="w-full sm:w-auto px-8 py-4 bg-white dark:bg-slate-800 hover:bg-gray-50 dark:hover:bg-slate-700 text-slate-900 dark:text-white border border-gray-200 dark:border-slate-700 rounded-2xl font-bold text-lg transition-all hover:-translate-y-1 flex items-center justify-center gap-2 shadow-lg shadow-slate-200/20 dark:shadow-none"
                          >
                            Узнать больше →
                          </button>
                        </div>
                      </div>
                    </div>
                  )}

                  {/* SCHEDULE TAB */}
                  {activeTab === 'schedule' && (
                    <div className="max-w-4xl mx-auto">
                      <div className="flex flex-col md:flex-row justify-between items-end md:items-center mb-10 gap-6">
                        <div>
                          <h2 className="text-4xl font-bold mb-2 text-slate-900 dark:text-white tracking-tight">Расписание</h2>
                          <div className="flex items-center gap-2 text-slate-500 dark:text-slate-400">
                            <span className="bg-slate-100 dark:bg-slate-800 px-3 py-1 rounded-lg text-sm font-medium border border-slate-200 dark:border-slate-700">Группа 10701120</span>
                            <span className="w-1 h-1 bg-slate-400 rounded-full"></span>
                            <span className="text-sm">ФИТР</span>
                          </div>
                        </div>

                        {/* Week Toggle */}
                        <div className="relative bg-white dark:bg-slate-800 p-1.5 rounded-2xl flex shadow-inner border border-gray-200 dark:border-slate-700">
                          <div 
                            className={`absolute top-1.5 bottom-1.5 rounded-xl bg-emerald-500 shadow-lg shadow-emerald-500/30 transition-all duration-300 ease-out`}
                            style={{
                              left: weekType === 'upper' ? '6px' : '50%',
                              width: 'calc(50% - 6px)'
                            }}
                          ></div>
                          
                          <button
                            onClick={() => setWeekType('upper')}
                            className={`relative z-10 px-6 py-2.5 rounded-xl text-sm font-bold transition-colors duration-300 w-36 ${
                              weekType === 'upper' ? 'bg-white dark:bg-slate-700 text-slate-900 dark:text-white shadow-sm' : 'text-slate-500 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white'
                            }`}
                          >
                            1 Неделя
                          </button>
                          <button
                            onClick={() => setWeekType('lower')}
                            className={`relative z-10 px-6 py-2.5 rounded-xl text-sm font-bold transition-colors duration-300 w-36 ${
                              weekType === 'lower' ? 'bg-white dark:bg-slate-700 text-slate-900 dark:text-white shadow-sm' : 'text-slate-500 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white'
                            }`}
                          >
                            2 Неделя
                          </button>
                        </div>
                      </div>

                      {/* Days Navigation */}
                      <div className="flex overflow-x-auto pb-6 gap-3 mb-2">
                        {daysOfWeek.map((day) => (
                          <button
                            key={day}
                            onClick={() => setSelectedDay(day)}
                            className={`min-w-[4rem] h-16 rounded-2xl flex flex-col items-center justify-center border-2 transition-all duration-300 ${
                              selectedDay === day
                                ? 'bg-emerald-500 border-emerald-500 text-white shadow-lg shadow-emerald-500/30 scale-105'
                                : 'bg-white dark:bg-slate-800 border-transparent hover:border-emerald-200 dark:hover:border-slate-600 text-slate-500 dark:text-slate-400 hover:text-slate-900 dark:hover:text-slate-200'
                            }`}
                          >
                            <span className={`text-sm font-medium ${selectedDay === day ? 'opacity-80' : 'opacity-60'}`}>{day}</span>
                          </button>
                        ))}
                      </div>

                      {/* Schedule List */}
                      <div className="space-y-4">
                        {currentSchedule.length > 0 ? (
                          currentSchedule.map((item) => (
                            <div 
                              key={item.id}
                              className="flex flex-col sm:flex-row gap-5 p-6 bg-white dark:bg-slate-800/80 backdrop-blur-md rounded-[1.5rem] border border-gray-100 dark:border-slate-700/50 shadow-lg hover:shadow-xl transition-all duration-300"
                            >
                              <div className="flex sm:flex-col items-center sm:items-start justify-center gap-1 sm:w-28 sm:border-r border-gray-100 dark:border-slate-700/50 pr-4">
                                 <div className="text-2xl font-black text-slate-800 dark:text-slate-200 tracking-tight">{item.time.split(' - ')[0]}</div>
                                 <div className="text-xs font-semibold text-slate-400 uppercase tracking-wide">Начало</div>
                              </div>

                              <div className="flex-grow pl-2 flex flex-col justify-center">
                                <div className="flex justify-between items-start mb-2">
                                  <h3 className="text-xl font-bold text-slate-900 dark:text-white">{item.subject}</h3>
                                  <span className={`text-[10px] uppercase tracking-wider px-3 py-1 rounded-full font-bold shadow-sm ${
                                    item.type === 'Лекция' ? 'bg-blue-50 text-blue-600 dark:bg-blue-900/20 dark:text-blue-300 border border-blue-100 dark:border-blue-900/30' : 
                                    item.type === 'Лабораторная' ? 'bg-red-50 text-red-600 dark:bg-red-900/20 dark:text-red-300 border border-red-100 dark:border-red-900/30' : 
                                    'bg-yellow-50 text-yellow-600 dark:bg-yellow-900/20 dark:text-yellow-300 border border-yellow-100 dark:border-yellow-900/30'
                                  }`}>
                                    {item.type}
                                  </span>
                                </div>
                                
                                <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 text-sm mt-1">
                                  <div className="flex items-center gap-2 text-slate-500 dark:text-slate-400">
                                    <span className="font-medium">{item.teacher}</span>
                                  </div>
                                  <div className="flex items-center gap-2 text-slate-500 dark:text-slate-400">
                                    <span className="font-medium">📍 Корпус {item.building}, ауд. {item.room}</span>
                                  </div>
                                </div>
                              </div>
                            </div>
                          ))
                        ) : (
                          <div className="flex flex-col items-center justify-center py-24 text-center">
                            <div className="text-6xl mb-6">☀️</div>
                            <h3 className="text-2xl font-bold text-slate-800 dark:text-white mb-2">Свободный день</h3>
                            <p className="text-slate-500 dark:text-slate-400 max-w-xs mx-auto">
                              Пар нет. Отличное время для саморазвития или отдыха.
                            </p>
                          </div>
                        )}
                      </div>
                    </div>
                  )}
                </main>
              </div>

              {/* Login Modal */}
              {isLoginModalOpen && (
                <div className="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm">
                  <div className="bg-white dark:bg-[#0B0F19] border border-gray-200 dark:border-slate-700 rounded-3xl w-full max-w-md p-8 shadow-2xl relative">
                    <button 
                      onClick={() => setIsLoginModalOpen(false)}
                      className="absolute right-6 top-6 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 transition-colors"
                    >
                      ✕
                    </button>
                    
                    <div className="text-center mb-8">
                      <div className="inline-flex justify-center items-center w-16 h-16 bg-gradient-to-tr from-emerald-400 to-teal-600 rounded-2xl text-white mb-6 shadow-lg shadow-emerald-500/30">
                        🔐
                      </div>
                      <h2 className="text-3xl font-bold text-slate-900 dark:text-white tracking-tight">Вход</h2>
                      <p className="text-slate-500 text-sm mt-3">Синхронизируйте расписание между устройствами</p>
                    </div>

                    <form className="space-y-5" onSubmit={(e) => e.preventDefault()}>
                      <div>
                        <label className="block text-xs font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-2 ml-1">Номер студенческого</label>
                        <input 
                          type="text" 
                          className="w-full px-5 py-4 rounded-xl bg-gray-50 dark:bg-slate-800/50 border border-gray-200 dark:border-slate-700 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent dark:text-white transition-all font-medium"
                          placeholder="10701120"
                        />
                      </div>
                      <div>
                        <label className="block text-xs font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-2 ml-1">Пароль</label>
                        <input 
                          type="password" 
                          className="w-full px-5 py-4 rounded-xl bg-gray-50 dark:bg-slate-800/50 border border-gray-200 dark:border-slate-700 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent dark:text-white transition-all font-medium"
                          placeholder="••••••••"
                        />
                      </div>
                      
                      <button className="w-full py-4 bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white rounded-xl font-bold text-lg shadow-lg shadow-emerald-500/30 transition-all hover:-translate-y-0.5 mt-2">
                        Войти в систему
                      </button>
                    </form>

                    <div className="mt-8 text-center text-sm">
                      <span className="text-slate-500">Нет аккаунта? </span>
                      <a href="#" className="text-emerald-600 dark:text-emerald-400 font-bold hover:underline">Создать аккаунт</a>
                    </div>
                  </div>
                </div>
              )}
            </div>
          );
        }

        // Рендеринг приложения
        console.log('Начало рендеринга приложения');
        try {
            const root = ReactDOM.createRoot(document.getElementById('root'));
            root.render(<App />);
            console.log('Приложение успешно отрендерено');
        } catch (error) {
            console.error('Ошибка рендеринга:', error);
            document.getElementById('root').innerHTML = `<div style="padding: 20px; color: red;">Ошибка рендеринга: ${error.message}</div>`;
        }
    </script>
</body>
</html>
