version: '3.8'

services:
  backend:
    build: ./backend
    container_name: bentumweb_backend
    restart: unless-stopped
    environment:
      - DEBUG=False
      - DATABASE_URL=postgresql://bentumweb:secure_password_2024@db:5432/bentumweb
      - ALLOWED_HOSTS=localhost,127.0.0.1,bentumweb.zetalink.ru
      - SECRET_KEY=your-super-secret-key-change-this-in-production
      - CORS_ALLOWED_ORIGINS=https://bentumweb.zetalink.ru,http://localhost:3000
    depends_on:
      - db
    volumes:
      - ./backend/media:/app/media
      - ./backend/logs:/app/logs
    networks:
      - bentumweb_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build: ./frontend
    container_name: bentumweb_frontend
    restart: unless-stopped
    environment:
      - VITE_API_URL=https://bentumweb.zetalink.ru
    networks:
      - bentumweb_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  db:
    image: postgres:15-alpine
    container_name: bentumweb_db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=bentumweb
      - POSTGRES_USER=bentumweb
      - POSTGRES_PASSWORD=secure_password_2024
      - POSTGRES_INITDB_ARGS=--encoding=UTF-8 --lc-collate=C --lc-ctype=C
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
    networks:
      - bentumweb_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bentumweb -d bentumweb"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  nginx:
    image: nginx:alpine
    container_name: bentumweb_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./backend/media:/var/www/media:ro
      - ./nginx/logs:/var/log/nginx
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      - bentumweb_network
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3

  redis:
    image: redis:7-alpine
    container_name: bentumweb_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass redis_password_2024
    volumes:
      - redis_data:/data
    networks:
      - bentumweb_network
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  bentumweb_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
