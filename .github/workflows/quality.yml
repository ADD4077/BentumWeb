name: Проверки качества

on:
  push:
    branches:
      - main
      - master
      - develop
      - release
  pull_request:
  workflow_dispatch:

jobs:
  frontend:
    name: Фронтенд: lint и build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Получить код репозитория
        uses: actions/checkout@v5

      - name: Настроить Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Установить зависимости
        run: npm ci

      - name: Запустить lint
        run: npm run lint

      - name: Собрать production build
        run: npm run build

  backend:
    name: Бэкенд: smoke-тесты
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DJANGO_SETTINGS_MODULE: backend.settings
      DJANGO_ENV: dev
      DJANGO_TEST_USE_SQLITE: "1"
      DJANGO_SECRET_KEY: test-secret-key
      DEBUG: "True"
      DJANGO_ALLOWED_HOSTS: 127.0.0.1,localhost
      DATABASE_ENGINE: sqlite3
      DATABASE_NAME: test.sqlite3
      DATABASE_USERNAME: ""
      DATABASE_PASSWORD: ""
      DATABASE_HOST: ""
      DATABASE_PORT: ""
      REDIS_URL: ""
      TELEGRAM_BOT_TOKEN: test-token
      TELEGRAM_CHAT_ID: test-chat
    steps:
      - name: Получить код репозитория
        uses: actions/checkout@v5

      - name: Настроить Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Установить зависимости
        run: pip install -r requirements.txt

      - name: Запустить Django system check
        run: python manage.py check

      - name: Запустить smoke-тесты
        run: python -m pytest api/tests.py -q
